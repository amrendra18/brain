{
  "name": "Native checks",
  "on": {"push": {}, "pull_request": {}, "workflow_call": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "native": {
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 30,
      "strategy": {
        "fail-fast": false,
        "matrix": {"include": [
          {"runner": "macos-latest", "target": "darwin/arm64"},
          {"runner": "macos-15-intel", "target": "darwin/amd64"},
          {"runner": "windows-latest", "target": "windows/amd64"},
          {"runner": "ubuntu-latest", "target": "linux/amd64"},
          {"runner": "ubuntu-24.04-arm", "target": "linux/arm64"}
        ]}
      },
      "defaults": {"run": {"shell": "bash"}},
      "env": {"BRAIN_EXPECT_TARGET": "${{ matrix.target }}"},
      "steps": [
        {"uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683", "with": {"persist-credentials": false, "fetch-depth": 0}},
        {"uses": "actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5", "with": {"go-version": "1.27.1", "cache": false}},
        {"name": "Verify pinned Go", "run": "scripts/prepare-ci --verify"},
        {"name": "Prove FTS5 on this target", "run": "scripts/prove-fts5"},
        {"name": "Full lane", "run": "scripts/check full"}
      ]
    }
  }
}
