{
  "name": "Release artifacts",
  "on": {"push": {"tags": ["v*"]}, "workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "jobs": {
    "checks": {"uses": "./.github/workflows/check.yml"},
    "package": {
      "needs": "checks",
      "runs-on": "macos-latest",
      "timeout-minutes": 15,
      "defaults": {"run": {"shell": "bash"}},
      "steps": [
        {"uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683", "with": {"persist-credentials": false, "fetch-depth": 0}},
        {"uses": "actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5", "with": {"go-version": "1.27.1", "cache": false}},
        {"name": "Verify pinned Go", "run": "scripts/prepare-ci --verify"},
        {"name": "Build clean tagged archives", "run": "scripts/package"},
        {"uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02", "with": {"name": "brain-release", "path": ".local/package/*", "if-no-files-found": "error", "retention-days": 14}}
      ]
    }
  }
}
